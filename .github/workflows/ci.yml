name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tools:
    name: Deterministic tooling (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the subtitle tool test suite
        run: python3 skills/cinemacc-subtitle-skill/scripts/test_srt_tools.py

  manifests:
    name: Skill and plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check manifest consistency and Agent Skills limits
        run: python3 tools/check_manifests.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm the skill is discoverable by the skills CLI
        run: npx -y skills@latest add ./ --list
